<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Kadek Ari</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-white shadow-md fixed w-full z-10 top-0">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">TugasTekweb.</h1>
            <ul class="flex space-x-6 text-sm font-medium">
                <li><a href="index.html" class="hover:text-blue-600 transition">Home</a></li>
                <li><a href="portfolio.html" class="text-blue-600">Portfolio</a></li>
            </ul>
        </div>
    </nav>

    <!-- Portfolio Section -->
    <section class="pt-32 pb-16 px-6 max-w-5xl mx-auto min-h-screen">
        <h2 class="text-3xl font-bold mb-8 text-center">Portfolio & Karya</h2>
        
        <!-- Implementasi Konsep Grid Tailwind -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- Item Portfolio -->
            <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition duration-300">
                <div class="h-48 bg-gray-200">
                    <img src="asset/portfolio.png" alt="Web Portfolio" class="w-full h-full object-cover">
                </div>
                <div class="p-6">
                    <h3 class="font-bold text-xl mb-2">Personal Web Vercel</h3>
                    <p class="text-gray-600 mb-4 text-sm">Website portfolio interaktif yang di-deploy di Vercel.</p>
                    
                    <!-- Tombol pemicu tugas Javascript -->
                    <button onclick="bukaModal()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                        Preview Website
                    </button>
                </div>
            </div>

        </div>
    </section>

    <!-- TUGAS JAVASCRIPT: Modal Interaktif -->
    <div id="portfolioModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 p-4">
        <div class="bg-white rounded-xl w-full max-w-4xl h-[80vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="font-bold text-lg">Preview Web</h3>
                <button onclick="tutupModal()" class="text-gray-500 hover:text-red-500 text-3xl leading-none">&times;</button>
            </div>
            <div class="flex-grow">
                <iframe src="https://portfolio-silk-beta-487xocrsdq.vercel.app/" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white text-center py-6 text-gray-500 text-sm">
        <p>&copy; 2024 Kadek Ari Putra Yasa. Tugas Teknologi Web.</p>
    </footer>

    <!-- Script Utama (Pemenuhan Syarat "Satu Tugas Javascript") -->
    <script>
        const modal = document.getElementById('portfolioModal');

        function bukaModal() {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Kunci scroll
        }

        function tutupModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto'; // Buka scroll
        }

        // Tutup saat klik di luar pop-up
        window.onclick = function(event) {
            if (event.target === modal) {
                tutupModal();
            }
        }
    </script>
</body>
</html>
